[workspace]
resolver = "2"
members = [
    "crates/tsuki-common",
    "crates/tsuki-guard",
    "crates/tsuki-actuator",
    "crates/tsuki-rollbackd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Snoxx Tech", "@Ghoy"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
nix = { version = "0.27", features = ["fs", "process", "signal", "user"] }
chrono = { version = "0.4", features = ["serde"] }
