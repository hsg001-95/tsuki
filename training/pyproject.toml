[project]
name = "tsuki-training"
version = "0.1.0"
description = "Tsuki Offline ML Training, Export, and Evaluation"
authors = [{ name = "Snoxx Tech", email = "ghoy@snoxx.tech" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "pyarrow>=14.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
