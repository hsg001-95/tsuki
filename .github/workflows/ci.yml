name: Tsuki CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-ci:
    name: Rust Workspace Checks & Safety Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo format check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo workspace tests
        run: cargo test --workspace

      - name: Mandatory 10-Test Safety Suite
        run: cargo test --test safety_suite

  python-ci:
    name: Python Test Suite & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Test Suites
        run: |
          PYTHONPATH=bench:reasoning:training pytest bench/tests training/tests reasoning/tests

      - name: Run Data-Driven Evaluation Suite
        run: |
          PYTHONPATH=bench:reasoning:training python bench/eval_suite.py
