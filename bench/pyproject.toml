[project]
name = "tsuki-bench"
version = "0.1.0"
description = "OS-FaultBench: Linux Fault Scenario Evaluation Harness"
authors = [{ name = "Snoxx Tech", email = "ghoy@snoxx.tech" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
